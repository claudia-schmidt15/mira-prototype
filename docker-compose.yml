services:
  postgis:
    image: postgis/postgis:15-3.4
    container_name: mira-postgis
    environment:
      POSTGRES_DB: mira
      POSTGRES_USER: mira
      POSTGRES_PASSWORD: mira
    ports:
      - "5432:5432"
    volumes:
      - mira_pgdata:/var/lib/postgresql/data

volumes:
  mira_pgdata:

